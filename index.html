<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Modelo 3D - Realidad Aumentada</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }

  </style>

</head>


<body>


<a-scene

  mindar-image="imageTargetSrc: ./targets.mind;"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


  <!-- ================================================= -->
  <!-- MODELO 3D                                         -->
  <!-- ================================================= -->

  <a-assets>

    <a-asset-item
      id="modelo3D"
      src="./scene.gltf">
    </a-asset-item>

  </a-assets>



  <!-- ================================================= -->
  <!-- CÁMARA                                            -->
  <!-- ================================================= -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- ================================================= -->
  <!-- IMAGEN OBJETIVO                                   -->
  <!-- ================================================= -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex: 0"

  >


    <!-- MODELO -->

    <a-entity

      id="modelo"

      gltf-model="#modelo3D">

    </a-entity>


  </a-entity>


</a-scene>



<script>


  /*
  ========================================================
  CONFIGURACIÓN
  ========================================================

  En MindAR:

  ancho de imagen objetivo = 1

  Nosotros queremos:

  ancho del modelo = 1.25

  Es decir, 125% del ancho de la imagen.
  */


  const ANCHO_MODELO = 1.25;


  /*
  Pequeña separación para que el modelo
  no quede metido dentro de la imagen.
  */

  const SEPARACION = 0.02;



  /*
  ========================================================
  OBTENER MODELO
  ========================================================
  */


  const modelo =
    document.querySelector("#modelo");



  /*
  ========================================================
  CUANDO TERMINE DE CARGAR EL MODELO
  ========================================================
  */


  modelo.addEventListener(

    "model-loaded",

    () => {


      /*
      Obtenemos el modelo real de Three.js
      que está dentro de A-Frame.
      */


      const objeto3D =
        modelo.getObject3D("mesh");


      if (!objeto3D) {

        console.error(
          "No se pudo encontrar el modelo 3D."
        );

        return;

      }



      /*
      Actualizamos sus coordenadas.
      */


      objeto3D.updateWorldMatrix(
        true,
        true
      );



      /*
      Creamos una caja invisible alrededor
      de todo el modelo.
      */


      const caja =
        new THREE.Box3().setFromObject(
          objeto3D
        );



      /*
      Calculamos su tamaño.
      */


      const tamano =
        new THREE.Vector3();


      caja.getSize(
        tamano
      );



      /*
      Calculamos el centro.
      */


      const centro =
        new THREE.Vector3();


      caja.getCenter(
        centro
      );



      /*
      ====================================================
      CALCULAR ESCALA
      ====================================================

      Ejemplo:

      modelo original = 4 unidades de ancho

      queremos = 1.25

      escala:

      1.25 / 4 = 0.3125

      Esto se calcula automáticamente.
      */


      const escala =

        ANCHO_MODELO /
        tamano.x;



      /*
      Aplicamos la misma escala
      en X, Y y Z.

      Así NO deformamos el modelo.
      */


      modelo.object3D.scale.set(

        escala,
        escala,
        escala

      );



      /*
      ====================================================
      CENTRAR MODELO
      ====================================================
      */


      const posicionX =

        -centro.x *
        escala;


      const posicionY =

        -centro.y *
        escala;



      /*
      ====================================================
      COLOCARLO ENCIMA DE LA IMAGEN
      ====================================================

      Tomamos la parte trasera del modelo
      y la colocamos ligeramente por encima
      de la imagen objetivo.
      */


      const posicionZ =

        -(caja.min.z * escala)
        + SEPARACION;



      modelo.object3D.position.set(

        posicionX,
        posicionY,
        posicionZ

      );



      /*
      Información para nosotros.

      No aparece en pantalla.
      Solo sirve si después necesitamos
      revisar la consola.
      */


      console.log(
        "Modelo cargado correctamente"
      );


      console.log(
        "Ancho original:",
        tamano.x
      );


      console.log(
        "Ancho final:",
        ANCHO_MODELO
      );


      console.log(
        "Escala aplicada:",
        escala
      );


    }

  );


</script>


</body>

</html>
