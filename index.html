<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Laboratorio RA - Cubo</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #interfaz {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 25px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #btnCaras {
      padding: 14px 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background-color: white;
      color: #222;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    #btnCaras:disabled {
      opacity: 0.4;
    }

    #informacion {
      display: none;
      padding: 12px 20px;
      border-radius: 12px;
      background-color: rgba(0,0,0,0.8);
      color: white;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="cubo-target"
      mindar-image-target="targetIndex: 0">

      <a-box
        position="0 0 0.2"
        width="0.35"
        height="0.35"
        depth="0.35"
        color="#4CC3D9"
        animation="property: rotation;
                   to: 0 360 0;
                   loop: true;
                   dur: 6000;
                   easing: linear">
      </a-box>

    </a-entity>

  </a-scene>


  <div id="interfaz">

    <div id="informacion">
      El cubo tiene <strong>6 caras cuadradas</strong>.
    </div>

    <button id="btnCaras" disabled>
      CARAS
    </button>

  </div>


  <script>

    const target = document.querySelector("#cubo-target");
    const botonCaras = document.querySelector("#btnCaras");
    const informacion = document.querySelector("#informacion");


    target.addEventListener("targetFound", () => {

      botonCaras.disabled = false;

    });


    target.addEventListener("targetLost", () => {

      botonCaras.disabled = true;
      informacion.style.display = "none";

    });


    botonCaras.addEventListener("click", () => {

      informacion.style.display = "block";

    });

  </script>

</body>
</html>
