<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Modelo 3D RA</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }

  </style>

</head>



<body>


<a-scene

  mindar-image="imageTargetSrc: ./targets.mind;"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


  <!-- MODELO 3D -->

  <a-assets>

    <a-asset-item
      id="modelo3D"
      src="./scene.gltf">
    </a-asset-item>

  </a-assets>



  <!-- CÁMARA -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- IMAGEN OBJETIVO -->

  <a-entity

    mindar-image-target="targetIndex: 0"

  >


    <!-- MODELO -->

    <a-gltf-model

      src="#modelo3D"

      position="0 0 0.30"

      rotation="0 0 0"

      scale="0.60 0.60 0.60">

    </a-gltf-model>


  </a-entity>


</a-scene>


</body>

</html>
